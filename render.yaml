# Render Blueprint for Sigunu — one Docker web service + a managed Postgres.
# In the Render dashboard: New + → Blueprint → pick this repo. It reads this file.
# You'll be prompted for the secret env vars marked `sync: false`.
services:
  - type: web
    name: sigunu
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_DIST
        value: /app/apps/web/dist
      # Postgres connection string, injected from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: sigunu-db
          property: connectionString
      # Secrets — set these in the Render dashboard (not committed):
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Optional — only needed for the AI PDF-import feature:
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: sigunu-db
    plan: free
